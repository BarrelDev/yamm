[package]
name = "yamm"
version = "0.1.0"
edition = "2024"
description = "Yet Another Mod Manager"

[dependencies]
"serde" = { version = "1.0.229", features = ["derive"] } 
"yaml_serde" = "0.10.4"
"serde_json" = "1.0"
"reqwest" = { version = "0.13", features = ["json"] }
"tokio" = { version = "1", features = ["full"] }
"futures" = "0.3.34"